name: Tests

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  unittests:
    name: phpunit (sf-${{matrix.symfony_version}} php-${{matrix.php_version}} orm-${{matrix.orm_version}})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/php:${{matrix.php_version}}
    strategy:
      fail-fast: true
      matrix:
        php_version: [ '8.3','8.4','8.5' ]
        symfony_version: [ '5.4', '6.4', '7.4' ]
        orm_version: [ '2.0', '3.0' ]
        exclude:
          - php_version: '8.3'
            symfony_version: '8.1'
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony_version }}.*
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Composer install
        run: composer update --with doctrine/orm:"^${{matrix.orm_version}}"
      - name: Run tests
        run: vendor/bin/phpunit --coverage-cobertura=build/cobertura.xml
