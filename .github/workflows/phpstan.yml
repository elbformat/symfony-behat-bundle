name: Static code analysis

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  phpstan:
    name: phpstan (sf-${{matrix.symfony_version}} php-${{matrix.php_version}})
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}/php:${{matrix.php_version}}
    strategy:
      matrix:
        php_version: ['8.3','8.4','8.5']
        symfony_version: [ '5.4', '6.4', '7.4']
        exclude:
          - php_version: '8.3'
            symfony_version: '8.1'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Pin symfony version
        run: composer config extra.symfony.require "^${{matrix.symfony_version}}"
      - name: Composer install
        run: composer install
      - name: Run code analysis
        run: vendor/bin/phpstan --memory-limit=-1
