name: Static code analysis

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  phpstan:
    name: phpstan (sf-${{matrix.symfony_version}} php-${{matrix.php_version}} orm-${{matrix.orm_version}})
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}/php:${{matrix.php_version}}
    strategy:
      matrix:
        php_version: [ '8.3', '8.4', '8.5' ]
        symfony_version: [ '5.4', '6.4', '7.4' ]
        orm_version: [ '2.0', '3.0' ]
        exclude:
          - php_version: '8.3'
            symfony_version: '8.1'
      fail-fast: false
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony_version }}.*
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Composer install
        run: composer update --with doctrine/orm:"^${{matrix.orm_version}}"
      - name: Run code analysis
        run: vendor/bin/phpstan --memory-limit=-1
